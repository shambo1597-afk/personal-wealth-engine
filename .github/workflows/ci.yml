name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Syntax check & pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax & import verification
        run: |
          python -m py_compile config.py database.py quant_engine.py tax_engine.py app.py
          python -c "import config, database, tax_engine, quant_engine"

      - name: Run pytest
        run: pytest -v
